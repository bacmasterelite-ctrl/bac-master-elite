        <p style="font-size:1.1rem;line-height:1.7;margin-top:1rem;">BAC Master Elite est la plateforme de préparation au Baccalauréat ivoirien dédiée aux lycéens des séries A, C et D. Cours interactifs, exercices corrigés, annales des années précédentes et tuteur IA disponibles gratuitement.</p>

        <ul style="line-height:2;margin-top:0.5rem;">
          <li>Philosophie — Cours complets et méthodologie de la dissertation</li>
          <li>Français et Littérature — Analyse de textes et commentaires composés</li>
          <li>Histoire-Géographie — Fiches de révision et annales corrigées</li>
          <li>Langues Vivantes (Anglais, Espagnol) — Grammaire et expression écrite</li>
        </ul>
        <h2 style="font-size:1.4rem;font-weight:700;margin-top:1.5rem;color:#1e40af;">Matières couvertes — Série C et D (Scientifiques)</h2>
        <ul style="line-height:2;margin-top:0.5rem;">
          <li>Mathématiques — Cours, exercices et sujets de BAC corrigés</li>
          <li>Physique-Chimie — Expériences, formules et exercices d'application</li>
          <li>Sciences de la Vie et de la Terre (SVT) — Biologie et géologie</li>
          <li>Philosophie — Méthodologie et sujets types</li>
        </ul>
