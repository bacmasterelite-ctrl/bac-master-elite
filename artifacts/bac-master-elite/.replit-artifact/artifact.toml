kind = "web"
previewPath = "/"
title = "BAC MASTER ELITE"
version = "1.0.0"
id = "artifacts/bac-master-elite"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/bac-master-elite run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bac-master-elite", "run", "build" ]
publicDir = "artifacts/bac-master-elite/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[[services.production.headers]]
source = "/(.*)"

[[services.production.headers.values]]
key = "X-Content-Type-Options"
value = "nosniff"

[[services.production.headers.values]]
key = "Referrer-Policy"
value = "strict-origin-when-cross-origin"

[[services.production.headers.values]]
key = "X-Frame-Options"
value = "SAMEORIGIN"

[[services.production.headers.values]]
key = "Permissions-Policy"
value = "camera=(), microphone=(), geolocation=(), payment=()"

[[services.production.headers.values]]
key = "Content-Security-Policy"
value = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none';"

[services.env]
PORT = "5173"
BASE_PATH = "/"
